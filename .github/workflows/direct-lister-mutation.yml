name: Direct lister mutation test

on:
  push:
    branches:
      - review/direct-lister-mutation-142304
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run direct lister mutation regression
        run: go test ./pkg/kubeapiserver/direct -run TestStorageClientReturnedObjectsAreIsolated -count=1 -v
