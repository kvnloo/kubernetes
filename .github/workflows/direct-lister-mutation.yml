name: Direct lister mutation test

on:
  push:
    branches:
      - review/direct-lister-mutation-142304
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run safe and unsafe conversion controls
        run: go test ./pkg/kubeapiserver/direct -run 'Test(StorageClientReturnedObjectsAreIsolated|UnsafeConversionAliasesSource)$' -count=1 -v
      - name: Benchmark conversion copy boundaries
        run: go test ./pkg/kubeapiserver/direct -run '^$' -bench 'BenchmarkPod.*ConversionCopyBoundary' -benchmem -count=3
